<style>
/* Layout: enamel-green signboard header, thumb-reach bottom tabs, one scrolling column (max 720px).
   Palette: signboard green (brand), turmeric (accent), green-tinted neutrals. Type: Bricolage for names and amounts, Figtree for the rest. */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --ink:#13201D; --ink2:#46564F; --muted:#6F8079; --line:#D8DFD6;
  --brand:#0E5A4F; --brand-ink:#FFFFFF; --accent:#E3A500; --accent-ink:#2B1F00;
  --good:#17744A; --bad:#B1352A; --field:#F7F9F5;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --navh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1614; --surface:#14211E; --ink:#E9F1ED; --ink2:#AEC0B9; --muted:#80938B; --line:#25352F;
  --brand:#0F6B5D; --brand-ink:#F3FBF8; --accent:#F0B530; --accent-ink:#241800;
  --good:#4CC38A; --bad:#F0877A; --field:#101B18; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C1614; --surface:#14211E; --ink:#E9F1ED; --ink2:#AEC0B9; --muted:#80938B; --line:#25352F;
  --brand:#0F6B5D; --brand-ink:#F3FBF8; --accent:#F0B530; --accent-ink:#241800;
  --good:#4CC38A; --bad:#F0877A; --field:#101B18; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:calc(var(--navh) + 40px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--brand);color:var(--brand-ink)}
header.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 16px;flex-wrap:wrap}
header.top h1{font:700 28px/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top .date{font-size:13px;opacity:.82;margin-top:4px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.pill.bad{background:var(--accent);color:var(--accent-ink)}

main{padding-block:18px 24px}
main .wrap{display:flex;flex-direction:column;gap:22px}
h2{font:700 19px/1.2 var(--display);margin:0 0 10px;letter-spacing:-.005em}
.hint{font-size:13.5px;color:var(--ink2);margin:0 0 10px;max-width:62ch}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* sell page */
.strip{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.strip b{display:block;font:700 34px/1.05 var(--display);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;width:100%;min-height:98px;padding:0;overflow:hidden;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s,border-color .15s}
.tile:hover{border-color:var(--brand)}
.tile:active{transform:scale(.97);background:var(--field)}
.tile .tn{font:600 16px/1.2 var(--display)}
.tile .tp{font:700 26px/1 var(--display);color:var(--brand);font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .tile .tp{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile .tp{color:var(--accent)}}
.badge{position:absolute;top:10px;right:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;padding:2px 9px;border-radius:99px;font-variant-numeric:tabular-nums}

/* panels and forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;align-items:end}
.form .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:600;min-width:0}
input,select{width:100%;min-width:0;padding:10px 11px;background:var(--field);border:1.5px solid var(--line);border-radius:8px;font-size:16px}
input:focus,select:focus{border-color:var(--brand)}
.btn{padding:10px 16px;border-radius:8px;border:1.5px solid var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700;touch-action:manipulation}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:600}
.btn.warn{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px}
.plist{display:flex;flex-direction:column;gap:10px}


/* ledger tables */
.ledger{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ledger th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.ledger th:first-child,.ledger td:first-child{text-align:left}
.ledger td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right}
.scroll .ledger td{white-space:nowrap}
.ledger tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;font-size:17px}
.ledger td.name{white-space:normal}
.scroll{overflow-x:auto;max-width:100%}
.pos{color:var(--good)}.neg{color:var(--bad)}
.note{font-size:14px;margin:10px 0 0;color:var(--ink2)}
.note b{color:var(--ink)}
.cash{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.mini:last-child{border-bottom:0}
.mini span.t{color:var(--ink2);font-size:14px;min-width:0}
.x{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.x.armed{color:var(--bad);font-weight:700}
.empty{padding:22px 16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink2);text-align:center}

/* analysis */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--ink2);stroke-width:1.2}
.bar{fill:var(--brand)}
.bar.p{fill:var(--good)}.bar.n{fill:var(--bad)}
.bar.sel{stroke:var(--ink);stroke-width:2}
.readout{margin:8px 0 0;font-size:14px;min-height:2.9em;color:var(--ink2)}
.readout b{color:var(--ink)}
.hb{display:grid;grid-template-columns:minmax(80px,1fr) 3fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hb .track{height:12px;background:var(--field);border-radius:3px;overflow:hidden}
.hb .fill{height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.hb .v{font-variant-numeric:tabular-nums;color:var(--ink2);text-align:right;white-space:nowrap}

/* nav + toast */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:10px}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--brand);background:var(--field)}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--accent)}}
#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.datebar{display:flex;gap:8px;align-items:center}
.datebar input{flex:1}
.matrix td:first-child,.matrix th:first-child{position:sticky;left:0;background:var(--bg)}
.matrix th{max-width:90px;white-space:normal;line-height:1.2}

.tw{position:relative;display:flex;min-width:0}
.tile .tt{display:flex;flex-direction:column;justify-content:space-between;gap:10px;flex:1;padding:12px 14px;width:100%}
.timg{width:100%;height:76px;object-fit:cover;display:block}
.minus{position:absolute;right:8px;bottom:8px;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--bad);font-size:26px;line-height:1;display:grid;place-items:center;touch-action:manipulation}
.minus:active{background:var(--field)}
.grid.credit .tile{border-color:var(--accent);border-style:dashed}
.banner{background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner select{width:auto;flex:1;min-width:140px;background:var(--surface);color:var(--ink)}
.prow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pimg{display:flex;flex-direction:column;gap:6px;align-items:center;width:88px}
.pimg .th{width:88px;height:88px;border-radius:10px;background:var(--field);border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;overflow:hidden}
.pimg .th img{width:100%;height:100%;object-fit:cover;display:block}
.pfields{flex:1;min-width:220px;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.pfields .nm{grid-column:1/-1}
.prow>.btn{flex-basis:100%}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.mu{color:var(--muted)}.sm{font-size:13px}
.tag{font-size:12px;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:99px}
.ledger td.sub{color:var(--muted);font-size:13px;padding-top:0}
.srow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sn{font:600 17px/1.2 var(--display)}
.sq{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.sq small{font:500 13px var(--body);color:var(--muted)}
.low{display:inline-block;background:var(--bad);color:#fff;font:700 11px var(--body);padding:2px 8px;border-radius:99px;vertical-align:middle;letter-spacing:.04em;text-transform:uppercase}
:root[data-theme="dark"] .low{color:#1a0a08}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .low{color:#1a0a08}}
.sbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.inl{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sitem{display:block}
.cust{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.cust .cb{font:700 20px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.cday{padding:8px 16px;margin-bottom:10px}
.cdh{padding:6px 0 4px}
.cbal{font-variant-numeric:tabular-nums}
#toast[hidden]{display:none}
#toast button{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseDate(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function addDays(s,n){var x=parseDate(s);x.setDate(x.getDate()+n);return fmtDate(x)}
function todayStr(){return fmtDate(new Date())}
function inr(n){var v=Math.round(n*100)/100;return (v<0?'−':'')+'₹'+Math.abs(v).toLocaleString('en-IN',{maximumFractionDigits:2})}
function qn(n){return (Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2})}
function num(v){var n=parseFloat(v);return isFinite(n)&&n>0?n:0}
function numOrNull(v){if(String(v).trim()==='')return null;return num(v)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function clone(o){return JSON.parse(JSON.stringify(o))}

function dateOnly(d){return parseDate(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}

function cls(v){return v>0?'pos':v<0?'neg':''}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- storage ---------- */
function lsLoad(){try{var r=JSON.parse(lsGet(LS)||'null');if(r)Object.keys(state).forEach(function(k){if(r[k]!==undefined)state[k]=r[k]});if(!state.settings.costBasis)state.settings.costBasis='purchases'}catch(e){}touch()}
function lsSave(){lsSet(LS,JSON.stringify(state))}
var pend={};
function docFor(key){
  if(key.indexOf(':')<0)return db.doc('shop/'+key);
  return db.doc(COLL[key[0]]+'/'+key.slice(2));
}
function payload(key){
  if(key==='products')return {items:state.products};
  if(key==='stock')return {items:state.stock};
  if(key==='customers')return {items:state.customers};
  if(key==='settings')return state.settings;
  var k=key.slice(2),t=key[0];
  if(t==='s')return state.sales[k]||null;
  if(t==='c')return state.csales[k]||null;
  if(t==='d'){var x=state.days[k];return x?{date:k,opening:x.opening,closing:x.closing}:null}
  return state[ARR[t]].filter(function(e){return e.id===k})[0]||null;
}
function save(key){
  touch();
  if(!db){lsSave();return}
  var p=pend[key]||(pend[key]={t:0,busy:false,redo:false});
  clearTimeout(p.t);p.t=setTimeout(function(){flush(key)},300);
  setStatus('Saving…');
}
function flush(key){
  var p=pend[key];if(!p)return;
  if(p.busy){p.redo=true;return}
  p.busy=true;p.redo=false;
  var data=payload(key),ref=docFor(key),ok=true;
  var job=data?ref.set(clone(data)):ref.delete();
  job.then(function(){},function(){ok=false}).then(function(){
    p.busy=false;
    if(p.redo){flush(key);return}
    if(pend[key]===p)delete pend[key];
    if(ok)setStatus();else setStatus('Not saved','bad');
  });
}
function setStatus(txt,kind){
  var el=$('#status');
  if(!txt){txt=mode==='cloud'?(Object.keys(pend).length?'Saving…':'Saved to your account'):mode==='device'?'Saved on this device':'Starting…'}
  el.textContent=txt;el.className='pill'+(kind==='bad'?' bad':'');
}
function subscribe(){
  var err=function(){setStatus('Sync stopped','bad')};
  var today=todayStr(),cut=addDays(today,-WINDOW);loadedFrom=cut;
  ['products','stock','customers'].forEach(function(key){
    db.doc('shop/'+key).onSnapshot(function(s){
      if(pend[key])return;
      if(s.exists&&s.data()&&Array.isArray(s.data().items)){state[key]=clone(s.data().items);touch()}
      remoteRender();
    },err);
  });
  db.doc('shop/settings').onSnapshot(function(s){
    if(pend.settings)return;
    if(s.exists&&s.data()){state.settings=Object.assign({costBasis:'purchases'},clone(s.data()));touch()}
    remoteRender();
  },err);
  Object.keys(ARR).forEach(function(t){
    var col=db.collection(COLL[t]);
    if(t==='u'||t==='a')col=col.where('date','>=',addDays(today,-400));
    col.onSnapshot(function(snap){
      var name=ARR[t];
      snap.docChanges().forEach(function(ch){
        var id=ch.doc.id;if(pend[t+':'+id])return;
        state[name]=state[name].filter(function(e){return e.id!==id});
        if(ch.type!=='removed')state[name].push(clone(ch.doc.data()));
      });
      touch();remoteRender();
    },err);
  });
  db.collection('days').onSnapshot(function(snap){
    snap.docChanges().forEach(function(ch){
      var id=ch.doc.id;if(pend['d:'+id])return;
      if(ch.type==='removed')delete state.days[id];
      else{var v=ch.doc.data();state.days[id]={opening:v.opening==null?null:v.opening,closing:v.closing==null?null:v.closing}}
    });
    remoteRender();
  },err);
  db.collection('sales').where('date','>=',cut).onSnapshot(function(snap){
    snap.docChanges().forEach(function(ch){
      var id=ch.doc.id;if(pend['s:'+id])return;
      if(ch.type==='removed')delete state.sales[id];else state.sales[id]=clone(ch.doc.data());
    });
    touch();remoteRender();
  },err);
  db.collection('csales').onSnapshot(function(snap){
    snap.docChanges().forEach(function(ch){
      var id=ch.doc.id;if(pend['c:'+id])return;
      if(ch.type==='removed')delete state.csales[id];else state.csales[id]=clone(ch.doc.data());
    });
    touch();remoteRender();
  },err);
}
function remoteRender(){
  var a=document.activeElement;
  if(a&&view.contains(a)&&/INPUT|SELECT/.test(a.tagName)){needsRender=true;return}
  render();
}
document.addEventListener('focusout',function(){if(needsRender){needsRender=false;setTimeout(render,0)}});

/* older records are loaded on demand */
function minStart(){var m=null;state.stock.forEach(function(i){if(i.startDate&&(!m||i.startDate<m))m=i.startDate});return m}
function loadFrom(){
  if(page==='history')return hist.mode==='day'?hist.date:hist.month+'-01';
  if(page==='stock')return minStart();
  return null;
}
function needsLoad(){var f=loadFrom();return !!(db&&f&&f<loadedFrom)}
function prepLoad(){
  if(!db||histLoading||!needsLoad())return;
  var from=loadFrom();
  histLoading=true;render();
  db.collection('sales').where('date','>=',from).where('date','<',loadedFrom).get().then(function(snap){
    snap.docs.forEach(function(d){state.sales[d.id]=clone(d.data())});touch();
  },function(){setStatus('Could not load older days','bad')}).then(function(){loadedFrom=from;histLoading=false;render()});
}

/* ---------- data ---------- */
function index(){
  if(idx)return idx;idx={};
  [[state.sales,false],[state.csales,true]].forEach(function(p){
    Object.keys(p[0]).forEach(function(k){var doc=p[0][k];(doc.sales||[]).forEach(function(s){(idx[doc.date]=idx[doc.date]||[]).push({s:s,k:k,c:p[1]})})});
  });
  Object.keys(idx).forEach(function(d){idx[d].sort(function(a,b){return a.s.t-b.s.t})});
  return idx;
}
function salesOf(d){return index()[d]||[]}
function myDoc(d,cr){var set=cr?state.csales:state.sales,k=d+'_'+dev;return set[k]||(set[k]={date:d,dev:dev,sales:[]})}
function ensureDay(d){return state.days[d]||(state.days[d]={opening:null,closing:null})}
function maps(){
  if(mp)return mp;mp={exp:{},pur:{},pay:{}};
  state.expenses.forEach(function(e){mp.exp[e.date]=(mp.exp[e.date]||0)+e.amount});
  state.purchases.forEach(function(e){mp.pur[e.date]=(mp.pur[e.date]||0)+e.amount});
  state.payments.forEach(function(e){mp.pay[e.date]=(mp.pay[e.date]||0)+e.amount});
  return mp;
}
function recipe(){return state.settings.costBasis==='recipe'}
function stats(d){
  var m=maps(),s=0,c=0,n=0,cr=0;
  salesOf(d).forEach(function(r){s+=r.s.p;c+=r.s.c;n++;if(r.s.cr)cr+=r.s.p});
  var exp=m.exp[d]||0,pur=m.pur[d]||0,pay=m.pay[d]||0,cost=recipe()?c:pur;
  return {d:d,sales:s,credit:cr,cost:cost,exp:exp,pur:pur,pay:pay,count:n,gross:s-cost,net:s-cost-exp};
}
function monthStats(prefix){
  var r={sales:0,cost:0,exp:0,pur:0,pay:0,count:0,days:0,credit:0},rc=0;
  Object.keys(index()).forEach(function(d){if(d.indexOf(prefix)===0){var s=stats(d);r.sales+=s.sales;r.credit+=s.credit;r.count+=s.count;if(s.count)r.days++;salesOf(d).forEach(function(x){rc+=x.s.c})}});
  state.expenses.forEach(function(e){if(e.date.indexOf(prefix)===0)r.exp+=e.amount});
  state.purchases.forEach(function(e){if(e.date.indexOf(prefix)===0)r.pur+=e.amount});
  state.payments.forEach(function(e){if(e.date.indexOf(prefix)===0)r.pay+=e.amount});
  r.cost=recipe()?rc:r.pur;r.net=r.sales-r.cost-r.exp;return r;
}
function prevClosing(t){
  var best=null;
  Object.keys(state.days).forEach(function(d){var x=state.days[d];if(d<t&&x.closing!=null&&(!best||d>best.d))best={d:d,v:x.closing}});
  return best;
}
function byProduct(list){
  var by={};list.forEach(function(r){var b=by[r.s.n]||(by[r.s.n]={q:0,a:0});b.q++;b.a+=r.s.p});return by;
}
function costLabel(){return recipe()?'Cost of items sold':'Stock bought'}

/* ---------- shared day block ---------- */
function cashNote(d){
  var x=state.days[d]||{},st=stats(d);
  if(x.opening==null)return 'Enter the opening cash to see how much should be in the drawer at night.';
  var exp=x.opening+(st.sales-st.credit)-st.exp-st.pur+st.pay;
  var h='Expected closing cash: <b class="num">'+inr(exp)+'</b> (opening + cash sales − expenses − stock bought'+(st.pay?' + credit payments received '+inr(st.pay):'')+').';
  if(x.closing!=null){
    var df=x.closing-exp;
    h+=' '+(Math.abs(df)<0.005?'<b class="pos">The count matches.</b>':df<0?'<b class="neg">Short by '+inr(-df)+'.</b>':'<b class="pos">Extra '+inr(df)+'.</b>');
  }
  return h;
}

/* stock */
function soldSince(sd){
  var ix=index(),m={};
  Object.keys(ix).forEach(function(d){if(d>=sd)ix[d].forEach(function(r){m[r.s.pid]=(m[r.s.pid]||0)+1})});
  return m;
}
function onHand(it){
  var q=+it.start||0,sd=it.startDate||'0000-00-00';
  state.purchases.forEach(function(p){if(p.item===it.id&&p.date>=sd)q+=p.qty});
  state.adjust.forEach(function(a){if(a.item===it.id&&a.date>=sd)q-=a.qty});
  var sold=soldSince(sd);
  state.products.forEach(function(p){if(p.stockId===it.id&&p.uses)q-=(sold[p.id]||0)*p.uses});
  return q;
}

/* analysis */
function rangeDates(offset){
  var end=new Date(),list=[],start;
  if(range==='month'){start=new Date(end.getFullYear(),end.getMonth(),1)}
  else{start=new Date(end);start.setDate(end.getDate()-(+range-1))}
  if(offset){var n=+range;end=new Date(start);end.setDate(end.getDate()-1);start=new Date(end);start.setDate(end.getDate()-(n-1))}
  for(var d=new Date(start);d<=end;d.setDate(d.getDate()+1))list.push(fmtDate(d));
  return list;
}
function viewAnalysis(){
  var ds=rangeDates(),rows=ds.map(function(d){return stats(d)});
  var tot={sales:0,cost:0,exp:0,count:0,net:0};
  rows.forEach(function(r){tot.sales+=r.sales;tot.cost+=r.cost;tot.exp+=r.exp;tot.count+=r.count;tot.net+=r.net});
  var seg=[['7','7 days'],['14','14 days'],['30','30 days'],['month','This month']].map(function(o){return '<button data-act="range" data-v="'+o[0]+'" aria-pressed="'+(range===o[0])+'">'+o[1]+'</button>'}).join('');
  var h='<div class="seg" role="group" aria-label="Time range">'+seg+'</div>';
  if(!tot.count&&!tot.exp&&!tot.cost)return h+'<div class="empty">Charts appear here after your first day of sales. Record sales on the Sell page.</div>';
  var best=rows.reduce(function(b,r){return r.sales>b.sales?r:b},rows[0]);
  var cmp='';
  if(range!=='month'){
    var pr=rangeDates(true).map(function(d){return stats(d)}),ps=pr.reduce(function(a,r){return a+r.sales},0);
    if(ps>0){var ch=(tot.sales-ps)/ps*100;cmp='<tr><td>Versus previous '+range+' days</td><td class="'+cls(ch)+'">'+(ch>=0?'+':'−')+Math.abs(Math.round(ch))+'%</td></tr>'}
  }
  h+='<section class="panel"><table class="ledger"><tbody>'+
   '<tr><td>Total sales</td><td>'+inr(tot.sales)+'</td></tr>'+
   '<tr><td>Average per day</td><td>'+inr(tot.sales/rows.length)+'</td></tr>'+
   (best.sales>0?'<tr><td>Best day</td><td>'+dayLabel(best.d)+' · '+inr(best.sales)+'</td></tr>':'')+cmp+
   '<tr><td>'+costLabel()+'</td><td>'+inr(tot.cost)+'</td></tr><tr><td>Expenses</td><td>'+inr(tot.exp)+'</td></tr>'+
   '<tr class="total"><td>'+(tot.net<0?'Loss':'Profit')+'</td><td class="'+cls(tot.net)+'">'+inr(tot.net)+'</td></tr></tbody></table></section>';
  h+='<section><h2>Sales per day</h2><div class="chart" id="ch-sales"></div><p class="readout" id="ro-sales"></p></section>';
  h+='<section><h2>Profit or loss per day</h2><div class="chart" id="ch-profit"></div><p class="readout" id="ro-profit"></p></section>';
  var all=[];ds.forEach(function(d){all=all.concat(salesOf(d))});
  var by=byProduct(all),names=Object.keys(by).sort(function(a,b){return by[b].a-by[a].a}),mx=names.length?by[names[0]].a:1;
  h+='<section><h2>What sold most</h2>';
  names.forEach(function(n){h+='<div class="hb"><span>'+esc(n)+'</span><span class="track"><span class="fill" style="display:block;width:'+Math.max(2,by[n].a/mx*100)+'%"></span></span><span class="v">'+by[n].q+' · '+inr(by[n].a)+'</span></div>'});
  h+='</section><section><h2>Day by day</h2><div class="scroll"><table class="ledger"><thead><tr><th>Day</th><th>Items</th><th>Sales</th><th>Expenses</th><th>Profit</th></tr></thead><tbody>';
  rows.slice().reverse().forEach(function(r){h+='<tr><td>'+dayLabel(r.d)+'</td><td>'+r.count+'</td><td>'+inr(r.sales)+'</td><td>'+inr(r.exp)+'</td><td class="'+cls(r.net)+'">'+inr(r.net)+'</td></tr>'});
  return h+'</tbody></table></div></section>';
}
function niceTicks(lo,hi,n){
  var span=(hi-lo)||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  var step=(f<=1?1:f<=2?2:f<=5?5:10)*mag,a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,t=[];
  for(var v=a;v<=b+step/2;v+=step)t.push(Math.round(v*100)/100);
  return t;
}
function drawBar(key){
  var c=charts[key];if(!c||!c.el)return;
  var W=Math.max(280,c.el.clientWidth),H=210,m={l:48,r:6,t:10,b:24},pw=W-m.l-m.r,ph=H-m.t-m.b,rows=c.rows;
  var vals=rows.map(function(r){return r.v}),lo=Math.min.apply(null,vals.concat(0)),hi=Math.max.apply(null,vals.concat(0));
  if(lo===0&&hi===0)hi=10;
  var tk=niceTicks(lo,hi,4);lo=tk[0];hi=tk[tk.length-1];
  var y=function(v){return m.t+ph*(1-(v-lo)/(hi-lo))},band=pw/rows.length,bw=Math.min(30,band*.7),s='';
  tk.forEach(function(v){s+='<line class="gl" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(m.l-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+(Math.abs(v)>=1000?(v/1000)+'k':v)+'</text>'});
  var every=Math.ceil(rows.length/Math.floor(pw/(rows.length<=8?46:26)));
  rows.forEach(function(r,i){
    var x=m.l+band*i+(band-bw)/2,y0=y(0),y1=y(r.v),top=Math.min(y0,y1),h=Math.max(Math.abs(y0-y1),r.v?2:0);
    var k=c.signed?(r.v<0?' n':' p'):'';
    s+='<rect class="bar'+k+(i===c.sel?' sel':'')+'" x="'+x+'" y="'+top+'" width="'+bw+'" height="'+h+'" rx="3"/>';
    if(i%every===0||i===rows.length-1&&every===1){var d=parseDate(r.d);s+='<text x="'+(m.l+band*i+band/2)+'" y="'+(H-6)+'" text-anchor="middle">'+(rows.length<=8?d.toLocaleDateString('en-IN',{weekday:'short'})+' '+d.getDate():d.getDate())+'</text>'}
  });
  s+='<line class="zero" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(0)+'" y2="'+y(0)+'"/>';
  c.el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(c.label)+'">'+s+'</svg>';
  c.ro.innerHTML=c.read(rows[c.sel]);
  var pick=function(e){var r=c.el.getBoundingClientRect(),i=Math.floor((e.clientX-r.left-m.l)/band);if(i>=0&&i<rows.length&&i!==c.sel){c.sel=i;drawBar(key)}};
  c.el.onclick=pick;c.el.onmousemove=function(e){if(e.pointerType!=='touch')pick(e)};
}
function drawCharts(){
  var ds=rangeDates(),rows=ds.map(function(d){return stats(d)}),last=rows.length-1;
  charts={
    sales:{el:$('#ch-sales'),ro:$('#ro-sales'),label:'Bar chart of sales per day',signed:false,sel:last,
      rows:rows.map(function(r){return {d:r.d,v:r.sales,r:r}}),
      read:function(r){return '<b>'+dayLabel(r.d)+'</b><br>'+inr(r.r.sales)+' sales · '+r.r.count+' items'}},
    profit:{el:$('#ch-profit'),ro:$('#ro-profit'),label:'Bar chart of profit or loss per day',signed:true,sel:last,
      rows:rows.map(function(r){return {d:r.d,v:r.net,r:r}}),
      read:function(r){var n=r.r.net;return '<b>'+dayLabel(r.d)+'</b><br><b class="'+cls(n)+'">'+(n<0?'Loss ':'Profit ')+inr(Math.abs(n))+'</b> = sales '+inr(r.r.sales)+' − '+costLabel().toLowerCase()+' '+inr(r.r.cost)+' − expenses '+inr(r.r.exp)}}
  };
  drawBar('sales');drawBar('profit');
}

/* ---------- render ---------- */
var views={sell:viewSell,products:viewProducts,today:viewToday,analysis:viewAnalysis,stock:viewStock,credit:viewCredit,history:viewHistory};
function render(){
  view.innerHTML=views[page]();
  $('#ptitle').textContent=TITLES[page];
  $('#pdate').textContent=longDate(todayStr());
  var nav=$('nav.tabs .in');
  document.querySelectorAll('nav.tabs button').forEach(function(b){
    if(b.dataset.go===page){b.setAttribute('aria-current','page');nav.scrollLeft=b.offsetLeft-(nav.clientWidth-b.offsetWidth)/2}
    else b.removeAttribute('aria-current');
  });
  if(page==='analysis'&&$('#ch-sales'))drawCharts();
}
function go(p){if(!views[p])return;page=p;armed=null;stockUI={id:null,kind:null};try{history.replaceState(null,'','#'+p)}catch(e){}render();window.scrollTo(0,0);prepLoad()}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(page==='analysis'&&$('#ch-sales')){drawBar('sales');drawBar('profit')}},150)});

var toastT;
function toast(msg,undoId){
  toastEl.innerHTML='<span>'+esc(msg)+'</span>'+(undoId?'<button data-act="undo" data-id="'+esc(undoId)+'">Undo</button>':'');
  toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){toastEl.hidden=true},4500);
}

/* ---------- actions ---------- */
function removeSale(id){
  var sets=[['s',state.sales],['c',state.csales]];
  for(var j=0;j<sets.length;j++){
    var keys=Object.keys(sets[j][1]);
    for(var i=0;i<keys.length;i++){
      var doc=sets[j][1][keys[i]],n=doc.sales.length;
      doc.sales=doc.sales.filter(function(s){return s.id!==id});
      if(doc.sales.length!==n){save(sets[j][0]+':'+keys[i]);return true}
    }
  }
  return false;
}
function shrink(file,cb){
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){
    var S=160,c=document.createElement('canvas');c.width=c.height=S;
    var m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
    c.getContext('2d').drawImage(img,sx,sy,m,m,0,0,S,S);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',.72));
  };
  img.onerror=function(){cb(null)};img.src=url;
}
document.addEventListener('click',function(e){
  var go_=e.target.closest('[data-go]');if(go_){go(go_.dataset.go);return}
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var act=b.dataset.act,id=b.dataset.id,t=todayStr();
  if(act==='sell'){
    var p=state.products.filter(function(q){return q.id===id})[0];if(!p)return;
    var cr=sellMode==='credit'?crCust:null;
    if(sellMode==='credit'&&!cr){toast('Add a customer in the Credit book first');return}
    var sid=uid(),sale={id:sid,t:Date.now(),pid:p.id,n:p.name,p:p.price,c:p.cost||0,b:myName};
    if(cr)sale.cr=cr;
    myDoc(t,!!cr).sales.push(sale);
    save((cr?'c:':'s:')+t+'_'+dev);render();toast(p.name+' '+inr(p.price)+' added'+(cr?' to '+custName(cr)+'’s credit':''),sid);
  }else if(act==='minus'){
    var pr=state.products.filter(function(q){return q.id===id})[0],cr2=sellMode==='credit'?crCust:null;
    var cands=salesOf(t).filter(function(r){return r.s.pid===id&&(cr2?r.s.cr===cr2:!r.s.cr)});
    if(!cands.length){toast(cr2?'No credit sale of '+(pr?pr.name:'this item')+' to remove for this customer':'No cash sale of '+(pr?pr.name:'this item')+' to remove. Switch to “On credit” to remove a credit sale.');return}
    var own=cands.filter(function(r){return r.k===t+'_'+dev}),pool=own.length?own:cands,last=pool[pool.length-1];
    removeSale(last.s.id);render();toast('Removed one '+(pr?pr.name:'item'));
  }else if(act==='smode'){sellMode=b.dataset.v;render()}
  else if(act==='undo'){if(removeSale(id)){toastEl.hidden=true;render()}}
  else if(act==='rmsale'){removeSale(id);render()}
  else if(act==='chname'){editName=true;render();var n=$('#nm-in');if(n)n.focus()}
  else if(act==='delp'){
    if(armed!=='p'+id){armed='p'+id;render();return}
    armed=null;state.products=state.products.filter(function(q){return q.id!==id});save('products');render();
  }else if(act==='rmphoto'){var pp=state.products.filter(function(q){return q.id===id})[0];if(pp){pp.img='';save('products');render()}}
  else if(act==='delitem'){
    var ty=b.dataset.t,k=ty+id;
    if(armed!==k){armed=k;render();return}
    armed=null;state[ARR[ty]]=state[ARR[ty]].filter(function(q){return q.id!==id});save(ty+':'+id);render();
  }else if(act==='useprev'){
    var d=b.dataset.date,pc=prevClosing(d);if(pc){ensureDay(d).opening=pc.v;save('d:'+d);render()}
  }else if(act==='range'){range=b.dataset.v;render()}
  else if(act==='hmode'){hist.mode=b.dataset.v;render();prepLoad()}
  else if(act==='hday'){var nd=addDays(hist.date,+b.dataset.v);if(nd<=t){hist.date=nd;render();prepLoad()}}
  else if(act==='sopen'){stockUI=(stockUI.id===id&&stockUI.kind===b.dataset.v)?{id:null,kind:null}:{id:id,kind:b.dataset.v};armed=null;render()}
  else if(act==='sclose'){stockUI={id:null,kind:null};render()}
  else if(act==='delstock'){
    if(armed!=='s'+id){armed='s'+id;render();return}
    armed=null;state.stock=state.stock.filter(function(s){return s.id!==id});state.products.forEach(function(p){if(p.stockId===id){p.stockId='';p.uses=0}});
    stockUI={id:null,kind:null};save('stock');save('products');render();
  }else if(act==='copen'){credCust=id;armed=null;render();window.scrollTo(0,0)}
  else if(act==='cback'){credCust=null;armed=null;render()}
  else if(act==='payfull'){var a=$('#cp-amt');if(a)a.value=b.dataset.v}
  else if(act==='delcust'){
    if(armed!=='k'+id){armed='k'+id;render();return}
    armed=null;state.customers=state.customers.filter(function(c){return c.id!==id});credCust=null;save('customers');render();
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.photo){
    var f=el.files&&el.files[0],p=state.products.filter(function(q){return q.id===el.dataset.photo})[0];if(!f||!p)return;
    shrink(f,function(url){
      if(!url){toast('That file could not be read as a photo');return}
      var old=p.img;p.img=url;
      if(JSON.stringify(state.products).length>235000){p.img=old;toast('Too many photos saved. Remove one before adding another.');return}
      save('products');render();toast('Photo saved');
    });return;
  }
  var row=el.closest&&el.closest('.prow');
  if(row&&el.dataset.f){
    var pr=state.products.filter(function(q){return q.id===row.dataset.id})[0];if(!pr)return;
    var fl=el.dataset.f;
    if(fl==='name'){pr.name=el.value.trim()||pr.name;el.value=pr.name}
    else if(fl==='cat')pr.cat=el.value;
    else if(fl==='stockId')pr.stockId=el.value;
    else if(fl==='uses'){pr.uses=num(el.value);el.value=pr.uses||''}
    else{pr[fl]=num(el.value);el.value=pr[fl]}
    save('products');return;
  }
  if(el.dataset&&el.dataset.cash){
    var d=el.dataset.date,x=ensureDay(d),v=numOrNull(el.value);
    if(el.dataset.cash==='open')x.opening=v;else x.closing=v;
    save('d:'+d);
    var cn=$('#cashnote'),sm=$('#summary');if(cn)cn.innerHTML=cashNote(d);if(sm)sm.innerHTML=summaryHtml(d);
    return;
  }
  if(el.id==='set-basis'){state.settings.costBasis=el.value;save('settings');toast('Profit method changed')}
  else if(el.id==='cr-cust'){crCust=el.value}
  else if(el.id==='h-date'&&el.value){hist.date=el.value>todayStr()?todayStr():el.value;render();prepLoad()}
  else if(el.id==='h-month'&&el.value){hist.month=el.value;render();prepLoad()}
  else if(el.id==='s-month'&&el.value){stockMonth=el.value;render()}
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,t=todayStr();
  if(f.id==='np-form'){
    var name=$('#np-name').value.trim();if(!name)return;
    state.products.push({id:'p'+uid(),name:name,price:num($('#np-price').value),cost:num($('#np-cost').value),cat:$('#np-cat').value});
    save('products');render();toast(name+' added to your products');
  }else if(f.id==='ex-form'){
    var label=$('#ex-label').value.trim(),amt=num($('#ex-amt').value);if(!label||!amt)return;
    var ne={id:'e'+uid(),label:label,amount:amt,date:$('#ex-date').value||t};
    state.expenses.push(ne);save('x:'+ne.id);render();toast('Expense of '+inr(amt)+' added');
  }else if(f.id==='nm-form'){
    myName=$('#nm-in').value.trim();lsSet('chai-name',myName);editName=false;render();
  }else if(f.id==='si-form'){
    var n=$('#si-name').value.trim(),u=$('#si-unit').value.trim();if(!n||!u)return;
    state.stock.push({id:'k'+uid(),name:n,unit:u,start:num($('#si-qty').value),startDate:t,low:num($('#si-low').value)});
    save('stock');render();toast(n+' added to stock');
  }else if(f.id==='sf-buy'||f.id==='sf-use'||f.id==='sf-count'||f.id==='sf-edit'){
    var it=stockItem(stockUI.id);if(!it)return;
    if(f.id==='sf-edit'){it.name=$('#sf-name').value.trim()||it.name;it.unit=$('#sf-unit').value.trim()||it.unit;it.low=num($('#sf-low').value);stockUI={id:null,kind:null};save('stock');render();return}
    if(f.id==='sf-count'){
      it.start=num($('#sf-qty').value);it.startDate=$('#sf-when').value==='after'?addDays(t,1):t;
      stockUI={id:null,kind:null};save('stock');render();toast(it.name+' set to '+qn(it.start)+' '+it.unit);return;
    }
    var q=num($('#sf-qty').value),dt=$('#sf-date').value||t,note=$('#sf-note').value.trim();if(!q)return;
    if(f.id==='sf-buy'){
      var amt2=num($('#sf-amt').value);if(!amt2)return;
      var pu={id:'u'+uid(),date:dt,item:it.id,name:it.name,unit:it.unit,qty:q,amount:amt2,note:note,by:myName,t:Date.now()};
      state.purchases.push(pu);save('u:'+pu.id);stockUI={id:null,kind:null};render();toast('Bought '+qn(q)+' '+it.unit+' of '+it.name+' for '+inr(amt2)+' ('+inr(amt2/q)+' per '+it.unit+')');
    }else{
      var ad={id:'a'+uid(),date:dt,item:it.id,name:it.name,unit:it.unit,qty:q,note:note,by:myName,t:Date.now()};
      state.adjust.push(ad);save('a:'+ad.id);stockUI={id:null,kind:null};render();toast(qn(q)+' '+it.unit+' of '+it.name+' taken out of stock');
    }
  }else if(f.id==='cu-form'){
    var cn=$('#cu-name').value.trim();if(!cn)return;
    var c={id:'c'+uid(),name:cn,phone:$('#cu-phone').value.trim()};
    state.customers.push(c);save('customers');render();toast(cn+' added');
  }else if(f.id==='cp-form'){
    var am=num($('#cp-amt').value);if(!am||!credCust)return;
    var py={id:'y'+uid(),date:$('#cp-date').value||t,cust:credCust,amount:am,note:$('#cp-note').value.trim(),by:myName,t:Date.now()};
    state.payments.push(py);save('y:'+py.id);render();toast('Payment of '+inr(am)+' saved');
  }
});
